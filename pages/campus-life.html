<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Life — IISER Kolkata · SAC Chronicle</title>
    <meta
      name="description"
      content="The campus in print — 269 photographs of IISER Kolkata's buildings, libraries, courts, hostels, and commons, filed from the SAC archive."
    />
    <link
      rel="preload"
      as="fetch"
      href="../public/assets/processed/assets_map.jsonl"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/preloader.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/clubs.css" />
    <link rel="stylesheet" href="../css/loader.css" />
    <link rel="stylesheet" href="../css/settings.css" />
    <link rel="stylesheet" href="../css/viewer.css" />
    <link rel="stylesheet" href="../css/print.css" media="print" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Campus Life — SAC IISER Kolkata" />
    <meta
      property="og:description"
      content="The campus in print — 269 photographs of IISER Kolkata's buildings, libraries, courts, hostels, and commons."
    />
    <meta property="og:image" content="../assets/hero.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Campus Life — SAC IISER Kolkata" />
    <meta
      name="twitter:description"
      content="The campus in print — 269 photographs of IISER Kolkata."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='10' fill='%23f4f0e6'/><text x='50' y='68' text-anchor='middle' font-family='Georgia,serif' font-weight='900' font-size='52' fill='%237e0909'>SAC</text></svg>"
    />
  </head>
  <body data-page="campus-life">
    <div id="preloader" class="preloader">
      <div class="preloader__ink"></div>
      <div class="preloader__kicker">The SAC Chronicle</div>
      <div class="preloader__bar"><div class="preloader__fill"></div></div>
      <div class="preloader__percent"><span class="preloader__percent-num">0</span>% loaded</div>
    </div>
    <script src="../js/preloader.js"></script>

    <header>
      <nav id="navbar" aria-label="Primary"></nav>
      <button
        class="navbar-corner"
        id="navbarCorner"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="navbar"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path
            d="M5 8h14M5 13h14M5 18h14"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            fill="none"
          />
        </svg>
      </button>
    </header>

    <main>
      <h1 class="page-title">Campus Life</h1>
      <p class="page-sub">
        The campus in print — every building, court, library, and commons of IISER Kolkata, filed
        from the SAC photographic archive.
      </p>

      <div class="clubs-search-wrap">
        <input
          type="search"
          id="campus-search"
          class="clubs-search"
          placeholder="Search campus places…"
          aria-label="Search campus places and categories"
          autocomplete="off"
        />
        <label class="campus-sort">
          <span class="visually-hidden">Sort categories</span>
          <select id="campus-sort" aria-label="Sort campus categories">
            <option value="count-desc">Most photos first</option>
            <option value="az">A – Z</option>
            <option value="count-asc">Fewest photos first</option>
            <option value="shuffle">Shuffle</option>
          </select>
        </label>
      </div>
      <div
        id="campus-chips"
        class="campus-chips"
        role="group"
        aria-label="Filter by campus category"
      ></div>
      <p id="campus-count" class="campus-count muted" role="status" aria-live="polite"></p>

      <section id="campus-grid" aria-label="Campus photograph archive">
        <p class="muted">Loading…</p>
      </section>
    </main>

    <div id="footer"></div>
    <noscript
      ><p class="noscript-warning">Enable JavaScript to browse the campus archive.</p></noscript
    >
    <script type="module" src="../js/main.js"></script>

    <div class="settings-overlay" id="settings-overlay"></div>
    <div class="settings-panel" id="settings-panel"></div>
    <button class="settings-fab" id="settings-fab" aria-label="Open settings" aria-expanded="false">
      ⚙
    </button>
  </body>
</html>
